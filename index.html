<style>
  :root{
    --ink:#1f2933;
    --ink-soft:#52606d;
    --paper:#f7f7f4;
    --panel:#ffffff;
    --line:#d9dce0;
    --blue:#2c5f8a;
    --blue-dark:#1e4260;
    --amber:#b8862c;
    --amber-bg:#fbf1de;
    --green:#2f7d4f;
    --green-bg:#e7f3ec;
    --grey-bg:#eceeef;
    --red:#a33b3b;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{padding-bottom:80px;}
  h1,h2,h3{margin:0;font-weight:600;}
  button{font-family:var(--sans);cursor:pointer;}
  input,select,textarea{font-family:var(--sans);}

  /* ---- Header ---- */
  .topbar{position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header{
    background:var(--blue-dark);
    color:#fff;
    padding:14px 16px;
  }
  header .top-row{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap;}
  .app-logo{height:34px;width:auto;flex-shrink:0;}
  header h1{font-size:17px;letter-spacing:.2px;margin-bottom:1px;}
  header .sub{font-size:12px;color:#c9d7e3;margin-top:2px;font-family:var(--mono);}
  .obra-pk-line{font-size:11px;color:#9db4c6;font-family:var(--mono);margin-bottom:4px;min-height:14px;}
  .obra-picker-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  #obraPicker{
    padding:4px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);color:#fff;font-size:12.5px;max-width:150px;
  }
  #obraPicker option{color:#1f2933;}
  .header-icon-btn{
    border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;
    border-radius:5px;padding:3px 8px;font-size:13px;line-height:1.4;
  }
  .header-icon-btn:hover{background:rgba(255,255,255,.18);}

  /* ---- Toolbar ---- */
  .toolbar{
    display:flex;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:6px;
    font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;
  }
  .btn:hover{background:var(--grey-bg);}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .btn.primary:hover{background:var(--blue-dark);}
  .btn-categoria{margin-left:14px;background:#eef2f5;border-color:#eef2f5;color:var(--blue-dark);font-weight:600;}
  .btn-categoria:hover{background:#e2e8ec;}
  input[type=file]{display:none;}

  /* ---- Search/filter ---- */

  /* ---- Content ---- */
  main{padding:12px 16px;max-width:900px;margin:0 auto;}
  .categoria{margin-bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .categoria-head{
    display:flex;align-items:center;gap:8px;padding:10px 14px;
    background:#eef2f5;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .categoria-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--blue-dark);flex:1;}
  .categoria-head .head-acts{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .categoria-head .chev{transition:transform .15s;color:var(--ink-soft);flex-shrink:0;}
  .categoria.collapsed .chev{transform:rotate(-90deg);}
  .categoria.collapsed .categoria-body{display:none;}
  .categoria-body{padding:6px 10px 10px;}

  .servico{border-top:1px solid var(--line);padding:10px 4px;}
  .servico:first-child{border-top:none;}
  .servico-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:6px;}
  .servico-head h3{font-size:14.5px;color:var(--ink);}
  .servico-progress{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);}
  .concluido-btn{
    margin-left:auto;flex-shrink:0;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  }
  .concluido-btn.active{background:var(--green-bg);color:var(--green);border-color:var(--green);}

  .registos{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .registo{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:#fcfcfb;flex-wrap:wrap;
  }
  .registo .pk{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);min-width:130px;}
  .registo .meta{font-size:12px;color:var(--ink-soft);flex:1;min-width:120px;}
  .registo .acts{display:flex;gap:4px;}
  .icon-btn{
    border:none;background:transparent;color:var(--ink-soft);font-size:14px;padding:4px 6px;border-radius:4px;
  }
  .icon-btn:hover{background:var(--grey-bg);}
  .icon-btn.del:hover{color:var(--red);}

  .empty-msg{font-size:12.5px;color:#8a97a3;padding:6px 4px;font-style:italic;}
  .add-registo-btn, .add-servico-btn{
    font-size:12.5px;color:var(--blue);background:none;border:1px dashed var(--line);border-radius:6px;
    padding:6px 10px;margin-top:8px;
  }
  .add-servico-btn{margin:10px 4px 4px;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,25,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;width:100%;max-width:480px;border-radius:12px 12px 0 0;padding:18px;max-height:88vh;overflow:auto;
  }
  @media(min-width:640px){
    .overlay{align-items:center;}
    .modal{border-radius:12px;}
  }
  .modal h3{font-size:16px;margin-bottom:14px;}
  .modal .field{margin-bottom:12px;}
  .modal label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .modal input, .modal select, .modal textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;
  }
  .modal textarea{resize:vertical;min-height:50px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .seg button{flex:1;padding:8px;border:none;background:#fff;font-size:13px;font-weight:500;}
  .seg button.active{background:var(--blue);color:#fff;}
  .modal .row{display:flex;gap:10px;}
  .modal .row .field{flex:1;}
  .modal-acts{display:flex;gap:8px;margin-top:16px;}
  .modal-acts .btn{flex:1;justify-content:center;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  @media print{
    .toolbar,.add-registo-btn,.add-servico-btn,.icon-btn,.concluido-btn,#obraPicker,.header-icon-btn{display:none !important;}
    body{padding:0;background:#fff;}
    header{background:#fff !important;color:#000;box-shadow:none;padding:0 0 12px;}
    header .sub{color:#555;}
    .obra-pk-line{color:#555;}
    .categoria{break-inside:avoid;border:1px solid #999;}
    .categoria-body{display:block !important;}
    .categoria.collapsed .categoria-body{display:block !important;}
  }
</style>
</head>
<body>

<div class="topbar">

<script>
/* ======================= DADOS ======================= */
const DEFAULT_CATEGORIAS = [
  {nome:"Terraplanagem", servicos:["ESCAVAÇÃO","FUNDO CAIXA"]},
  {nome:"Pavimentação", servicos:["SUB-BASE","BASE","BINDER","DESGASTE"]},
  {nome:"Drenagem de Subsolo", servicos:["RACHÃO","BRITA","GEOTEXTIL","DUTOS PERFURADOS"]},
  {nome:"Lancis", servicos:["LANCIS - ESQ.","LANCIS - DRT."]},
  {nome:"Passeio", servicos:["FUNDO CAIXA","APLICAÇÃO DE BETÃO"]},
  {nome:"Drenagem Pluvial", servicos:["COLETORES","CX VISITA","CX CEGA","SARGETAS"]},
  {nome:"Drenagem Residual", servicos:["RESIDUAL ESQUERDA","RESIDUAL DIREITA"]},
  {nome:"Rede de Iluminação Pública", servicos:["CABLAGEM","MACIÇOS","POSTES","LUMINÁRIAS"]},
  {nome:"Telecomunicações", servicos:["CAIXAS DE INSPEÇÃO","DUTOS"]},
  {nome:"Eletricidade", servicos:["DUTOS","CAIXAS DE INSPEÇÃO"]},
  {nome:"Diversos", servicos:["ABAST AGUA"]}
];

function uid(){return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);}

function buildObra(opts){
  opts = opts || {};
  return {
    id: uid(), nome: opts.nome || "", cc: opts.cc || "", pkIni: opts.pkIni || "", pkFim: opts.pkFim || "",
    categorias: DEFAULT_CATEGORIAS.map(c=>({
      id: uid(), nome: c.nome, collapsed:false,
      servicos: c.servicos.map(s=>({id:uid(), nome:s, concluido:false, registos:[]}))
    }))
  };
}

function buildDefaultData(){
  const obra = buildObra({});
  return { activeObraId: obra.id, obras: [obra] };
}

// Aceita ficheiros antigos (uma só obra, sem lista "obras") e converte para o novo formato.
function normalizeAppData(data){
  if(data && Array.isArray(data.obras) && data.activeObraId) return data;
  if(data && data.categorias){
    const legacy = {
      id: (data.obra && data.obra.id) || uid(),
      nome: (data.obra && data.obra.nome) || "",
      cc: (data.obra && data.obra.cc) || "",
      pkIni: (data.obra && data.obra.pkIni) || "",
      pkFim: (data.obra && data.obra.pkFim) || "",
      categorias: data.categorias
    };
    return { activeObraId: legacy.id, obras: [legacy] };
  }
  return buildDefaultData();
}

function getActiveObra(){
  return appData.obras.find(o=>o.id===appData.activeObraId) || appData.obras[0];
}

let appData = buildDefaultData();
let currentFileHandle = null; // File System Access API handle (desktop)
let editingContext = null; // {categoriaId, servicoId, registoId|null}

/* ======================= RASCUNHO AUTOMÁTICO (neste aparelho/browser) =======================
   O ficheiro inteiro (todas as obras) é guardado automaticamente numa única chave do browser,
   para recuperar o trabalho se a aplicação fechar sem se clicar em Guardar. */
const AUTOSAVE_KEY = 'andamento-obra-autosave-v2';

function saveDraftLocal(){
  try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(appData)); }
  catch(err){ console.warn('Não foi possível guardar o rascunho automático.', err); }
}
function loadDraftLocal(){
  try{
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(err){ return null; }
}

/* ======================= OBRAS ======================= */
function switchObra(id){
  if(!appData.obras.find(o=>o.id===id)) return;
  appData.activeObraId = id;
  renderAll();
}

let obraModalMode = 'nova'; // 'nova' | 'editar'

function openNovaObraModal(){
  obraModalMode = 'nova';
  document.getElementById('obraModalTitle').textContent = 'Nova obra';
  document.getElementById('novaObraNome').value = '';
  document.getElementById('novaObraCC').value = '';
  document.getElementById('novaObraPkIni').value = '';
  document.getElementById('novaObraPkFim').value = '';
  document.getElementById('obraOverlay').classList.add('show');
}
function openEditarObraModal(){
  obraModalMode = 'editar';
  const obra = getActiveObra();
  document.getElementById('obraModalTitle').textContent = 'Editar obra';
  document.getElementById('novaObraNome').value = obra.nome || '';
  document.getElementById('novaObraCC').value = obra.cc || '';
  document.getElementById('novaObraPkIni').value = obra.pkIni || '';
  document.getElementById('novaObraPkFim').value = obra.pkFim || '';
  document.getElementById('obraOverlay').classList.add('show');
}
function closeNovaObraModal(){
  document.getElementById('obraOverlay').classList.remove('show');
}
function saveNovaObra(){
  const nome = document.getElementById('novaObraNome').value.trim();
  if(!nome){ alert('Indique o nome da obra.'); return; }
  const cc = document.getElementById('novaObraCC').value.trim();
  const pkIni = document.getElementById('novaObraPkIni').value.trim();
  const pkFim = document.getElementById('novaObraPkFim').value.trim();

  if(obraModalMode === 'editar'){
    const obra = getActiveObra();
    obra.nome = nome; obra.cc = cc; obra.pkIni = pkIni; obra.pkFim = pkFim;
    closeNovaObraModal();
    renderAll();
    showToast('Obra atualizada');
  } else {
    const obra = buildObra({nome, cc, pkIni, pkFim});
    appData.obras.push(obra);
    appData.activeObraId = obra.id;
    closeNovaObraModal();
    renderAll();
    showToast('Obra criada');
  }
}

function deleteObraAtiva(){
  if(appData.obras.length<=1){ alert('Não é possível eliminar a única obra do ficheiro.'); return; }
  const obra = getActiveObra();
  if(!confirm('Eliminar a obra "'+(obra.nome||'(sem nome)')+'" e todos os seus dados? Esta ação não pode ser desfeita.')) return;
  appData.obras = appData.obras.filter(o=>o.id!==obra.id);
  appData.activeObraId = appData.obras[0].id;
  renderAll();
  showToast('Obra eliminada');
}

/* ======================= RENDER ======================= */
function populateObraSwitcher(){
  const sel = document.getElementById('obraPicker');
  sel.innerHTML = appData.obras
    .map(o=>`<option value="${escapeHtml(o.id)}">${escapeHtml(o.nome||'(sem nome)')}</option>`)
    .join('');
  sel.value = appData.activeObraId;
}

function obraTitleText(obra){
  return (obra.cc ? obra.cc + ' — ' : '') + (obra.nome || 'Sem nome');
}

function renderAll(){
  const obra = getActiveObra();
  document.getElementById('obraTitleDisplay').textContent = obraTitleText(obra);
  document.getElementById('obraPkLine').textContent = (obra.pkIni || obra.pkFim) ? `PK ${obra.pkIni || '?'} — ${obra.pkFim || '?'}` : '';

  populateObraSwitcher();

  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  obra.categorias.forEach(cat=>{
    const catEl = document.createElement('div');
    catEl.className = 'categoria' + (cat.collapsed ? ' collapsed' : '');

    const head = document.createElement('div');
    head.className = 'categoria-head';
    head.onclick = ()=>{ cat.collapsed = !cat.collapsed; renderAll(); };
    head.innerHTML = `<span class="chev">▾</span><h2>${escapeHtml(cat.nome)}</h2><span class="head-acts"><button class="icon-btn" title="Renomear categoria" onclick="event.stopPropagation();renameCategoria('${cat.id}')">✎</button><button class="icon-btn del" title="Eliminar categoria" onclick="event.stopPropagation();deleteCategoria('${cat.id}')">🗑</button></span>`;
    catEl.appendChild(head);

    const body = document.createElement('div');
    body.className = 'categoria-body';

    const addServ = document.createElement('button');
    addServ.className = 'add-servico-btn';
    addServ.textContent = '＋ Adicionar serviço em "'+cat.nome+'"';
    addServ.onclick = ()=>promptNovoServico(cat.id);
    body.appendChild(addServ);

    cat.servicos.forEach(serv=>{
      const servEl = document.createElement('div');
      servEl.className = 'servico';
      const progressoTxt = serv.concluido ? 'Serviço concluído' : (serv.registos.length ? (serv.registos.length+' registo(s)') : 'sem registos');
      servEl.innerHTML = `<div class="servico-head">
          <h3>${escapeHtml(serv.nome)}</h3>
          <span class="servico-progress">${progressoTxt}</span>
        </div>`;

      const concBtn = document.createElement('button');
      concBtn.className = 'concluido-btn' + (serv.concluido ? ' active' : '');
      concBtn.textContent = serv.concluido ? '✓ Serviço concluído' : 'Marcar serviço como concluído';
      concBtn.onclick = ()=>toggleServicoConcluido(cat.id, serv.id);
      servEl.querySelector('.servico-head').appendChild(concBtn);

      const editServBtn = document.createElement('button');
      editServBtn.className = 'icon-btn';
      editServBtn.title = 'Renomear serviço';
      editServBtn.textContent = '✎';
      editServBtn.onclick = ()=>renameServico(cat.id, serv.id);
      servEl.querySelector('.servico-head').appendChild(editServBtn);

      const delServBtn = document.createElement('button');
      delServBtn.className = 'icon-btn del';
      delServBtn.title = 'Eliminar serviço';
      delServBtn.textContent = '🗑';
      delServBtn.onclick = ()=>deleteServico(cat.id, serv.id);
      servEl.querySelector('.servico-head').appendChild(delServBtn);

      const regsWrap = document.createElement('div');
      regsWrap.className = 'registos';

      const listToShow = serv.registos;

      if(listToShow.length===0){
        const emp = document.createElement('div');
        emp.className='empty-msg';
        emp.textContent = 'Sem registos ainda.';
        regsWrap.appendChild(emp);
      } else {
        listToShow.slice().sort((a,b)=>(a.pkIni||'').localeCompare(b.pkIni||'')).forEach(reg=>{
          const r = document.createElement('div');
          r.className = 'registo';
          const pkTxt = reg.tipo==='ponto' ? `PK ${reg.pkIni}` : `PK ${reg.pkIni} → ${reg.pkFim}`;
          r.innerHTML = `
            <span class="pk">${escapeHtml(pkTxt)}</span>
            <span class="meta">${reg.data ? formatDate(reg.data) : ''}${reg.obs ? ' · '+escapeHtml(reg.obs) : ''}</span>
            <span class="acts">
              <button class="icon-btn" onclick="editRegisto('${cat.id}','${serv.id}','${reg.id}')">✎</button>
              <button class="icon-btn del" onclick="deleteRegisto('${cat.id}','${serv.id}','${reg.id}')">🗑</button>
            </span>`;
          regsWrap.appendChild(r);
        });
      }
      servEl.appendChild(regsWrap);

      const addBtn = document.createElement('button');
      addBtn.className = 'add-registo-btn';
      addBtn.textContent = '＋ Adicionar registo de PK';
      addBtn.onclick = ()=>openRegistoModal(cat.id, serv.id, null);
      servEl.appendChild(addBtn);

      body.appendChild(servEl);
    });

    catEl.appendChild(body);
    main.appendChild(catEl);
  });

  saveDraftLocal();
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(d){
  const parts = d.split('-');
  if(parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];
  return d;
}

/* ======================= MODAL REGISTO ======================= */
function openRegistoModal(categoriaId, servicoId, registoId){
  editingContext = {categoriaId, servicoId, registoId};
  const cat = getActiveObra().categorias.find(c=>c.id===categoriaId);
  const serv = cat.servicos.find(s=>s.id===servicoId);

  document.getElementById('registoModalTitle').textContent = registoId ? ('Editar registo — '+serv.nome) : ('Novo registo — '+serv.nome);

  let reg = registoId ? serv.registos.find(r=>r.id===registoId) : null;
  setTipoRegisto(reg ? reg.tipo : 'intervalo');
  document.getElementById('regPkIni').value = reg ? reg.pkIni : '';
  document.getElementById('regPkFim').value = reg ? (reg.pkFim||'') : '';
  document.getElementById('regData').value = reg ? (reg.data||'') : new Date().toISOString().slice(0,10);
  document.getElementById('regObs').value = reg ? (reg.obs||'') : '';

  document.getElementById('registoOverlay').classList.add('show');
}
function closeRegistoModal(){
  document.getElementById('registoOverlay').classList.remove('show');
  editingContext = null;
}
function setTipoRegisto(tipo){
  document.getElementById('tipoIntervaloBtn').classList.toggle('active', tipo==='intervalo');
  document.getElementById('tipoPontoBtn').classList.toggle('active', tipo==='ponto');
  document.getElementById('pkFimWrap').style.display = tipo==='ponto' ? 'none' : 'block';
  document.getElementById('pkIniLabel').textContent = tipo==='ponto' ? 'PK' : 'PK inicial';
  document.getElementById('registoOverlay').dataset.tipo = tipo;
}
function saveRegisto(){
  const tipo = document.getElementById('registoOverlay').dataset.tipo || 'intervalo';
  const pkIni = document.getElementById('regPkIni').value.trim();
  const pkFim = document.getElementById('regPkFim').value.trim();
  if(!pkIni){ alert('Indique o PK.'); return; }
  if(tipo==='intervalo' && !pkFim){ alert('Indique o PK final ou mude para "PK pontual".'); return; }

  const {categoriaId, servicoId, registoId} = editingContext;
  const cat = getActiveObra().categorias.find(c=>c.id===categoriaId);
  const serv = cat.servicos.find(s=>s.id===servicoId);

  const dados = {
    tipo, pkIni, pkFim: tipo==='ponto' ? null : pkFim,
    data: document.getElementById('regData').value,
    obs: document.getElementById('regObs').value.trim()
  };

  if(registoId){
    const idx = serv.registos.findIndex(r=>r.id===registoId);
    serv.registos[idx] = {...serv.registos[idx], ...dados};
  } else {
    serv.registos.push({id:uid(), ...dados});
  }
  closeRegistoModal();
  renderAll();
  showToast('Registo guardado');
}
function editRegisto(catId,servId,regId){ openRegistoModal(catId,servId,regId); }
function deleteRegisto(catId,servId,regId){
  if(!confirm('Eliminar este registo?')) return;
  const cat = getActiveObra().categorias.find(c=>c.id===catId);
  const serv = cat.servicos.find(s=>s.id===servId);
  serv.registos = serv.registos.filter(r=>r.id!==regId);
  renderAll();
  showToast('Registo eliminado');
}

/* ======================= FICHEIRO ======================= */
function serializeSelfContainedHtml(){
  const fullHtml = document.documentElement.outerHTML;
  // Substitui o bloco de dados embutido pelo estado atual
  const marker = /window\.__EMBEDDED_DATA__\s*=\s*.*?;/s;
  const injected = `window.__EMBEDDED_DATA__ = ${JSON.stringify(appData)};`;
  let out;
  if(marker.test(fullHtml)){
    out = fullHtml.replace(marker, injected);
  } else {
    out = fullHtml.replace('</body>', `<script>${injected}<\/script></body>`);
  }
  return '<!DOCTYPE html>\n' + out;
}

async function guardarFicheiro(){
  const htmlContent = serializeSelfContainedHtml();
  const nomeBase = appData.obras.length===1
    ? (getActiveObra().nome ? getActiveObra().nome.replace(/[^a-z0-9]+/gi,'-') : 'OBRA')
    : 'OBRAS';
  const filename = 'APO-' + nomeBase + '.html';

  if(window.showSaveFilePicker){
    try{
      if(!currentFileHandle){
        currentFileHandle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{description:'Ficheiro HTML', accept:{'text/html':['.html']}}]
        });
      }
      const writable = await currentFileHandle.createWritable();
      await writable.write(htmlContent);
      await writable.close();
      document.getElementById('fileStatus').textContent = 'backup guardado: ' + currentFileHandle.name;
      showToast('Backup guardado');
      return;
    }catch(err){
      if(err.name==='AbortError') return;
      console.warn('File System Access API falhou, a usar download.', err);
    }
  }
  // Fallback: download (telemóvel / browsers sem suporte)
  const blob = new Blob([htmlContent], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  document.getElementById('fileStatus').textContent = 'backup descarregado: ' + filename + ' (reenviar por WhatsApp/email)';
  showToast('Backup descarregado');
}

/* ======================= EXCEL ======================= */
function buildAndamentoRows(){
  const rows = [];
  getActiveObra().categorias.forEach(cat=>{
    cat.servicos.forEach(serv=>{
      serv.registos.slice().sort((a,b)=>(a.pkIni||'').localeCompare(b.pkIni||'')).forEach(reg=>{
        rows.push([
          cat.nome, serv.nome, serv.concluido ? 'Sim' : 'Não',
          reg.tipo==='ponto' ? 'Ponto' : 'Intervalo',
          reg.pkIni, reg.tipo==='ponto' ? '' : (reg.pkFim||''),
          reg.data ? formatDate(reg.data) : '',
          reg.obs || ''
        ]);
      });
    });
  });
  return rows;
}

function buildAndamentoWorkbook(){
  const rows = buildAndamentoRows();
  if(rows.length===0) return null;
  rows.unshift(['Categoria','Serviço','Serviço Concluído','Tipo','PK Início','PK Fim','Data','Observações']);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:20},{wch:18},{wch:16},{wch:10},{wch:12},{wch:12},{wch:12},{wch:35}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Andamento');

  const filename = 'APO-' + (getActiveObra().nome ? getActiveObra().nome.replace(/[^a-z0-9]+/gi,'-') : 'Obra') + '-' + new Date().toISOString().slice(0,10) + '.xlsx';
  return {wb, filename};
}

function exportarExcel(){
  const built = buildAndamentoWorkbook();
  if(!built){ alert('Ainda não há registos para exportar.'); return; }
  XLSX.writeFile(built.wb, built.filename);
  showToast('Excel exportado');
}

function buildAndamentoPdfBlob(){
  const rows = buildAndamentoRows();
  if(rows.length===0) return null;
  const obra = getActiveObra();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});

  doc.setFontSize(14);
  const tituloObra = obraTitleText(obra);
  doc.text('APO — ' + tituloObra, 40, 36);
  doc.setFontSize(9);
  const pkTxt = (obra.pkIni || obra.pkFim) ? `PK ${obra.pkIni || '?'} a ${obra.pkFim || '?'}` : '';
  const dataTxt = 'Gerado em ' + new Date().toLocaleDateString('pt-PT');
  doc.text([pkTxt, dataTxt].filter(Boolean).join('   ·   '), 40, 52);

  doc.autoTable({
    startY: 64,
    head: [['Categoria','Serviço','Concluído','Tipo','PK Início','PK Fim','Data','Observações']],
    body: rows,
    styles:{ fontSize:8, cellPadding:4 },
    headStyles:{ fillColor:[30,66,96], textColor:255 },
    alternateRowStyles:{ fillColor:[247,247,244] }
  });

  const filename = 'APO-' + (obra.nome ? obra.nome.replace(/[^a-z0-9]+/gi,'-') : 'Obra') + '-' + new Date().toISOString().slice(0,10) + '.pdf';
  return { blob: doc.output('blob'), filename };
}

async function exportarViaWhatsApp(){
  const built = buildAndamentoPdfBlob();
  if(!built){ alert('Ainda não há registos para exportar.'); return; }
  const mime = 'application/pdf';

  if(navigator.canShare && window.File){
    try{
      const file = new File([built.blob], built.filename, {type:mime});
      if(navigator.canShare({files:[file]})){
        await navigator.share({
          files:[file],
          title:'APO',
          text:'APO — ' + (getActiveObra().nome || 'Obra')
        });
        showToast('Partilhado');
        return;
      }
    }catch(err){
      if(err.name==='AbortError') return;
      console.warn('Partilha falhou, a descarregar em alternativa.', err);
    }
  }
  // Fallback: sem suporte a partilha de ficheiros (ex. computador) — descarrega e avisa
  const url = URL.createObjectURL(built.blob);
  const a = document.createElement('a');
  a.href = url; a.download = built.filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  alert('O seu browser não permite partilha direta. O ficheiro PDF foi descarregado — pode anexá-lo manualmente numa conversa do WhatsApp.');
}

/* ======================= TOAST ======================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ======================= INIT ======================= */
(function init(){
  const embedded = (typeof window.__EMBEDDED_DATA__ !== 'undefined') ? window.__EMBEDDED_DATA__ : null;
  if(embedded && (embedded.categorias || embedded.obras)){
    appData = normalizeAppData(embedded);
    document.getElementById('fileStatus').textContent = 'dados carregados deste ficheiro';
  } else {
    const draft = loadDraftLocal();
    if(draft){
      appData = normalizeAppData(draft);
      document.getElementById('fileStatus').textContent = 'rascunho recuperado (guardado automaticamente neste aparelho)';
    }
  }
  renderAll();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
